  #       fromDatabase:
  #         name: hatsune-postgres
  #         property: connectionString

# 2. Istanza Redis Gestita (Free Tier)
redis:
  name: hatsune-redis
  plan: free
  ipAllowList: [] # Consente connessioni solo interne tra i container di Render

# 3. Istanza PostgreSQL Gestita (Free Tier)
databases:
  - name: hatsune-postgres
    plan: free
